<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Zhirong Cai — Game, Audio, Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A87C" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8A87C" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#9AE6B4" stop-opacity="1"/>
      <stop offset="82%" stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#9AE6B4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9AE6B4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect width="960" height="220" rx="18" fill="url(#bg)"/>
  <rect width="960" height="220" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="958" height="218" rx="17" fill="none" stroke="#243041" stroke-width="1.2"/>
  <rect x="16" y="16" width="928" height="188" rx="12" fill="none" stroke="#1a2433" stroke-width="1"/>

  <!-- ambient glow -->
  <ellipse cx="480" cy="118" rx="280" ry="48" fill="url(#glow)"/>

  <!-- corner marks -->
  <g stroke="#334155" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M28 42V32H38"/>
    <path d="M922 42V32H912"/>
    <path d="M28 178V188H38"/>
    <path d="M922 178V188H912"/>
  </g>

  <!-- meta label -->
  <text x="48" y="52" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="3.2">STUDIO · SIGNAL · SYSTEMS</text>

  <!-- name -->
  <text x="48" y="96" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="36" font-weight="700" letter-spacing="1.5">ZHIRONG CAI</text>

  <!-- role line -->
  <text x="48" y="126" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="0.6">Game &amp; Audio Developer  ·  AI Agent  ·  Skill / Plugin</text>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <rect x="48" y="146" width="78" height="24" rx="6" fill="#12201a" stroke="#2f5d48"/>
    <text x="63" y="162" fill="#9AE6B4">Unity</text>
    <rect x="136" y="146" width="58" height="24" rx="6" fill="#121820" stroke="#3b4f6a"/>
    <text x="150" y="162" fill="#7DD3FC">UE5</text>
    <rect x="204" y="146" width="70" height="24" rx="6" fill="#201812" stroke="#6b4a34"/>
    <text x="218" y="162" fill="#E8A87C">Audio</text>
    <rect x="284" y="146" width="78" height="24" rx="6" fill="#10201c" stroke="#2f5d48"/>
    <text x="298" y="162" fill="#9AE6B4">Agents</text>
  </g>

  <!-- animated waveform -->
  <g filter="url(#soft)" opacity="0.95" transform="translate(0,8)">
    <path fill="none" stroke="url(#wave)" stroke-width="2.4" stroke-linecap="round"
      d="M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176">
      <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
        values="
          M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176;
          M48 188 C 110 188, 140 200, 180 178 S 250 150, 300 178 S 380 210, 430 188 S 500 150, 560 170 S 640 208, 700 188 S 780 150, 840 178 S 900 198, 912 188;
          M48 188 C 110 188, 120 160, 180 172 S 250 214, 300 192 S 380 146, 430 164 S 500 214, 560 192 S 640 152, 700 174 S 780 214, 840 186 S 900 166, 912 174;
          M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176
        "/>
    </path>
    <path fill="none" stroke="#9AE6B4" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"
      d="M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176">
      <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
        values="
          M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176;
          M48 188 C 110 188, 140 200, 180 178 S 250 150, 300 178 S 380 210, 430 188 S 500 150, 560 170 S 640 208, 700 188 S 780 150, 840 178 S 900 198, 912 188;
          M48 188 C 110 188, 120 160, 180 172 S 250 214, 300 192 S 380 146, 430 164 S 500 214, 560 192 S 640 152, 700 174 S 780 214, 840 186 S 900 166, 912 174;
          M48 188 C 110 188, 130 168, 180 168 S 250 208, 300 188 S 380 150, 430 168 S 500 210, 560 188 S 640 148, 700 168 S 780 208, 840 188 S 900 170, 912 176
        "/>
    </path>
  </g>

  <!-- right status -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="end">
    <circle cx="894" cy="48" r="4" fill="#9AE6B4">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="882" y="52" fill="#64748B" font-size="11" letter-spacing="1.5">LIVE</text>
  </g>
</svg>
